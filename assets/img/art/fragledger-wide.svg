<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="FragLedger key art: a CS2 match ledger in the dark">
  <defs>
    <linearGradient id="flwSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14090C"/>
      <stop offset=".55" stop-color="#1C0E12"/>
      <stop offset="1" stop-color="#2A1214"/>
    </linearGradient>
    <radialGradient id="flwGlow" cx=".72" cy=".38" r=".5">
      <stop offset="0" stop-color="#FF5E62" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FF5E62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flwCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241418"/>
      <stop offset="1" stop-color="#160C0E"/>
    </linearGradient>
    <linearGradient id="flwMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A72"/>
      <stop offset="1" stop-color="#FF4D4D"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#flwSky)"/>
  <rect width="1600" height="900" fill="url(#flwGlow)"/>
  <!-- faint grid -->
  <g stroke="#3A2024" stroke-width="1" opacity=".45">
    <path d="M0 180h1600M0 360h1600M0 540h1600M0 720h1600"/>
    <path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/>
  </g>
  <!-- ledger card -->
  <rect x="180" y="160" width="720" height="560" rx="36" fill="url(#flwCard)" stroke="#4A282C" stroke-width="3"/>
  <path d="M240 280h520M240 350h520M240 420h400M240 490h460M240 560h280" stroke="#5A3438" stroke-width="10" stroke-linecap="round"/>
  <path d="M240 640h140" stroke="url(#flwMark)" stroke-width="12" stroke-linecap="round"/>
  <!-- floating score chips -->
  <rect x="980" y="220" width="280" height="120" rx="24" fill="#1A1014" stroke="#4A282C" stroke-width="3"/>
  <text x="1020" y="272" fill="#8A6A6E" font-family="ui-monospace,monospace" font-size="22" letter-spacing="4">KAST</text>
  <text x="1020" y="314" fill="#F4F6FB" font-family="ui-sans-serif,system-ui" font-size="40" font-weight="700">78.4%</text>
  <rect x="1040" y="380" width="340" height="120" rx="24" fill="#1A1014" stroke="#4A282C" stroke-width="3"/>
  <text x="1080" y="432" fill="#8A6A6E" font-family="ui-monospace,monospace" font-size="22" letter-spacing="4">FRAG RATING</text>
  <text x="1080" y="474" fill="#FF8A72" font-family="ui-sans-serif,system-ui" font-size="40" font-weight="700">1.27</text>
  <rect x="980" y="540" width="300" height="120" rx="24" fill="#1A1014" stroke="#4A282C" stroke-width="3"/>
  <text x="1020" y="592" fill="#8A6A6E" font-family="ui-monospace,monospace" font-size="22" letter-spacing="4">ADR</text>
  <text x="1020" y="634" fill="#F4F6FB" font-family="ui-sans-serif,system-ui" font-size="40" font-weight="700">86.2</text>
  <!-- crosshair -->
  <circle cx="1280" cy="160" r="46" stroke="url(#flwMark)" stroke-width="6" fill="none"/>
  <path d="M1280 120v16M1280 184v16M1240 160h16M1304 160h16" stroke="#FF8A72" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1280" cy="160" r="6" fill="#FF5E62"/>
</svg>
