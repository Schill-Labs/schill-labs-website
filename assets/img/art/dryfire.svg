<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Dryfire Trainer key art">
  <defs>
    <linearGradient id="dfBg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#201014"/>
      <stop offset="1" stop-color="#12080B"/>
    </linearGradient>
    <linearGradient id="dfRing" x1="30" y1="30" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A7A"/>
      <stop offset="1" stop-color="#E23D4F"/>
    </linearGradient>
    <radialGradient id="dfGlow" cx="100" cy="100" r="90" gradientUnits="userSpaceOnUse">
      <stop offset=".4" stop-color="#FF5A5A" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF5A5A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#dfBg)"/>
  <circle cx="100" cy="100" r="90" fill="url(#dfGlow)"/>
  <!-- timer arc -->
  <circle cx="100" cy="100" r="66" stroke="#3A2026" stroke-width="7"/>
  <path d="M100 34a66 66 0 0 1 62.6 45.3" stroke="url(#dfRing)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="162.6" cy="79.3" r="6" fill="#FF8A7A"/>
  <!-- crosshair ticks -->
  <path d="M100 18v12M100 170v12M18 100h12M170 100h12" stroke="#7A4A52" stroke-width="5" stroke-linecap="round"/>
  <!-- sight picture: rear notch + front post -->
  <path d="M56 118V96h20v22" stroke="#F3E9EA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M124 118V96h20v22" stroke="#F3E9EA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="92" y="88" width="16" height="30" rx="3.5" fill="url(#dfRing)"/>
  <circle cx="100" cy="76" r="4.4" fill="#FF8A7A"/>
</svg>
