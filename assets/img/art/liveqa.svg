<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Live QA key art">
  <defs>
    <linearGradient id="lqBg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E1830"/>
      <stop offset="1" stop-color="#08101E"/>
    </linearGradient>
    <linearGradient id="lqAcc" x1="40" y1="40" x2="170" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8EE8FF"/>
      <stop offset="1" stop-color="#4ECBFF"/>
    </linearGradient>
    <radialGradient id="lqGlow" cx="100" cy="100" r="92" gradientUnits="userSpaceOnUse">
      <stop offset=".42" stop-color="#4ECBFF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#4ECBFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#lqBg)"/>
  <circle cx="100" cy="100" r="92" fill="url(#lqGlow)"/>
  <!-- incoming question bubble -->
  <rect x="36" y="48" width="92" height="46" rx="16" fill="#15243C" stroke="#2A4468" stroke-width="3"/>
  <path d="M52 66h48M52 78h30" stroke="#6A88B0" stroke-width="4" stroke-linecap="round"/>
  <path d="M52 94l-8 14 22-10" fill="#15243C" stroke="#2A4468" stroke-width="3" stroke-linejoin="round"/>
  <!-- answer bubble -->
  <rect x="72" y="104" width="92" height="46" rx="16" fill="url(#lqAcc)"/>
  <path d="M90 122h48M90 134h28" stroke="#073044" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <path d="M148 150l8 14-22-10" fill="#4ECBFF"/>
  <!-- live pulse -->
  <circle cx="154" cy="58" r="8" fill="#4ECBFF"/>
  <circle cx="154" cy="58" r="14" stroke="#4ECBFF" stroke-width="3" opacity=".45"/>
  <circle cx="154" cy="58" r="20" stroke="#4ECBFF" stroke-width="2" opacity=".2"/>
</svg>
